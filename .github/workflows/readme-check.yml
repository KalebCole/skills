name: readme-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify README catalog is up to date
        run: python3 scripts/generate-readme.py --check
